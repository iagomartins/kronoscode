<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Cosmic IDE Space -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="100%" stop-color="#00183A" />
    </linearGradient>

    <!-- Bracket Gradient: Tech Cyan -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#007ACC" />
    </linearGradient>

    <!-- Scythe Gradient: Titan Gold to Amber -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>

    <!-- Drop Shadow for Neon Glow Effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. App Icon Base (Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <!-- Inner Subtle Border -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.05" />

  <!-- 2. The Rings of Time (Astrolabe / Cosmic Background) -->
  <circle cx="256" cy="256" r="180" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 12" opacity="0.1" />
  <circle cx="256" cy="256" r="140" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="12 24" opacity="0.1" />
  <circle cx="256" cy="256" r="100" stroke="#FFD700" stroke-width="1" stroke-dasharray="4 8" opacity="0.2" />

  <!-- 3. The </> Mark with Kronos Scythe -->
  <g filter="url(#shadow)">
    
    <!-- Left Bracket < -->
    <path d="M 190 166 L 100 256 L 190 346" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Bracket > -->
    <path d="M 322 166 L 412 256 L 322 346" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- The Scythe Handle (The Diagonal Slash of the Code Tag) -->
    <!-- Passes perfectly through the geometric center (256, 256) -->
    <line x1="184" y1="384" x2="310" y2="160" 
          stroke="url(#goldGrad)" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- The Scythe Blade (Curving over the code) -->
    <!-- M 296 170 hides the seam inside the rounded handle cap -->
    <path d="M 296 170 
             C 380 90, 320 20, 160 40 
             C 250 70, 280 120, 280 170 Z" 
          fill="url(#goldGrad)" />
  </g>

  <!-- 4. The Spark of API / Magic (Star at the blade tip) -->
  <path d="M 150 25 L 153 35 L 163 38 L 153 41 L 150 51 L 147 41 L 137 38 L 147 35 Z" 
        fill="#FFFFFF" 
        opacity="0.8" />
  <path d="M 400 130 L 402 135 L 407 137 L 402 139 L 400 144 L 398 139 L 393 137 L 398 135 Z" 
        fill="#00F0FF" 
        opacity="0.6" />
</svg>
