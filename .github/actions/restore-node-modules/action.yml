name: Restore node_modules cache
description: Computes the node_modules cache key natively, restores the cache, and extracts it on a hit.

inputs:
  key-prefix:
    description: Prefix for the cache key.
    required: true
  lookup-only:
    description: When 'true', only checks whether the cache entry exists.
    default: 'false'

outputs:
  cache-hit:
    description: "'true' when the node_modules cache was restored from an exact key match."
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Create build directory
      shell: bash
      run: mkdir -p .build

    # Removemos a dependência do script azure-pipelines e usamos a função hashFiles nativa
    - name: Restore node_modules cache
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: .build/node_modules_cache
        key: "${{ inputs.key-prefix }}-${{ hashFiles('**/package-lock.json') }}"
        lookup-only: ${{ inputs.lookup-only }}

    - name: Export node_modules cache key (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: echo "NODE_MODULES_CACHE_KEY=${{ steps.restore.outputs.cache-primary-key }}" >> "$GITHUB_ENV"

    - name: Export node_modules cache key (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-Content -Path $env:GITHUB_ENV -Value "NODE_MODULES_CACHE_KEY=${{ steps.restore.outputs.cache-primary-key }}"

    - name: Extract node_modules cache (Unix)
      if: runner.os != 'Windows' && inputs.lookup-only != 'true' && steps.restore.outputs.cache-hit == 'true'
      shell: bash
      run: ./.github/workflows/node_modules_cache/cache.sh extract

    - name: Extract node_modules cache (Windows)
      if: runner.os == 'Windows' && inputs.lookup-only != 'true' && steps.restore.outputs.cache-hit == 'true'
      shell: pwsh
      run: ./.github/workflows/node_modules_cache/cache.ps1 extract
